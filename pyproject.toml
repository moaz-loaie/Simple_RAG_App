[project]
name = "rag-app"
version = "0.1.0"
description = "Modular PDF RAG with OpenRouter, Ollama fallback, and cited sources."
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langchain>=1.3.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.1",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.11.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.57.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
